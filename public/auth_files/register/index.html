<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Register Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <style>
      .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bar {
        display: inline-block;
        width: 7px;
        height: 20px;
        font-size: 40px;
        background-color: #f97102;
        /* background-color: rgba(255, 255, 255, 0.5); */
        border-radius: 10px;
        animation: scale-up4 1s linear infinite;
      }

      .bar:nth-child(2) {
        height: 35px;
        margin: 0 5px;
        animation-delay: 0.25s;
      }

      .bar:nth-child(3) {
        animation-delay: 0.5s;
      }

      @keyframes scale-up4 {
        20% {
          background-color: #ffff;
          transform: scaleY(1.5);
        }

        40% {
          transform: scaleY(1);
        }
      }
    </style>
    <section
      id="sign-section"
      class="flex-col items-center justify-center w-[80%] mx-auto"
    >
      <h1
        id="sign-text"
        class="text-center mt-10 h-10 text-3xl font-bold mb-10"
      >
        Sign Up
      </h1>
      <form action="" class="mb-3">
        <label for="sign-email" class="w-[90%] pt-2 mx-auto block"
          >Username</label
        >
        <div
          class="flex items-center w-[90%] px-2 pb-2 border-b-2 border-b-[grey] mx-auto mb-5"
        >
          <i class="fas fa-user text-gray-500"></i
          ><input
            id="sign-user-name"
            type="text"
            name="username"
            placeholder="Your User Name"
            class="block mx-auto pt-2 px-4 focus:outline-none"
            required
          />
        </div>
        <label for="email" class="w-[90%] pt-2 mx-auto block">Email</label>
        <div
          class="flex items-center w-[90%] px-2 pb-2 border-b-2 border-b-[grey] mx-auto mb-5"
        >
          <i class="fas fa-envelope text-gray-500"></i
          ><input
            id="sign-email"
            type="email"
            name="email"
            placeholder="Your Email"
            class="block mx-auto py-2 px-4 focus:outline-none"
            required
          />
        </div>
        <label for="email" class="w-[90%] pt-2 mx-auto block">Password</label>
        <div
          class="flex items-center w-[90%] px-2 pb-2 border-b-2 border-b-[grey] mx-auto"
        >
          <i class="fas fa-lock text-gray-500"></i
          ><input
            id="sign-pass"
            type="password"
            name="password"
            placeholder="Your Password"
            class="block mx-auto py-2 px-4 focus:outline-none"
            minlength="8"
            required
          />
        </div>
        <label for="email" class="w-[90%] pt-4 mx-auto block"
          >Confirm Password</label
        >
        <div
          class="flex items-center w-[90%] px-2 pb-2 border-b-2 border-b-[grey] mx-auto"
        >
          <i class="fas fa-lock text-gray-500"></i
          ><input
            id="sign-pass2"
            type="password"
            name="password2"
            placeholder="Repeat Password"
            class="block mx-auto py-2 px-4 focus:outline-none"
            minlength="8"
            required
          />
        </div>

        <div class="mx-auto w-[90%] mt-16">
          <button
            id="sign-btn"
            type="submit"
            class="w-[100%] rounded-3xl border-2 border-black h-10 text-[16px] font-semibold bg-black text-white"
          >
            SIGN UP
          </button>
          <button
            id="sign-cancel-btn"
            class="w-[100%] rounded-3xl border-2 border-black h-10 text-[16px] font-semibold mt-5"
          >
            CANCEL
          </button>
        </div>
      </form>
      <div style="display: none" class="loader">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </section>
    <script>
      const BASE_URL = `https://dev-elevate-ruddy.vercel.app/`;
      const signBtn = document.getElementById("sign-btn");
      const cancelBtn = document.getElementById("sign-cancel-btn");
      const form = document.querySelector("form");

      const loader = document.querySelector(".loader");

      async function checkScreenAndDevice() {
        const screen = window.screen.width;
        const device = window.navigator.userAgent;

        if (screen > 500) {
          await Swal.fire({
            title: "Please use a Mobile device",
            text: "This app is optimized for mobile devices",
            icon: "error",
            confirmButtonText: "Ok",
          });
          document.body.innerHTML =
            "Please open it in mobile phones, and then refresh it";
        }
      }

      setInterval(checkScreenAndDevice, 10000);

      document.addEventListener("DOMContentLoaded", async () => {
        checkScreenAndDevice();
      });

      window.addEventListener("resize", () => {
        checkScreenAndDevice();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const username = formData.get("username");
        const email = formData.get("email");
        const password = formData.get("password");
        const password2 = formData.get("password2");

        const data = {
          username,
          email,
          password,
        };

        if (!data) {
          Swal.fire({
            icon: "error",
            title: "Incomplete Form",
            text: "Please fill in all fields",
          });
          return;
        }
        if (password !== password2) {
          document.getElementById("sign-pass").style.border = "1px solid red";
          document.getElementById("sign-pass2").style.border = "1px solid red";
          Swal.fire({
            icon: "error",
            title: "Password Mismatch",
            text: "Passwords do not match",
            time: 1000,
          });
          return;
        }

        try {
          loader.style.display = "block flex";
          const response = await fetch(`${BASE_URL}/register`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });
          loader.style.display = "none";
          const result = await response.json();
          if (
            !result.valid &&
            result.message === "please enter correct email to precede"
          ) {
            document.getElementById("sign-email").style.border =
              "1px solid red";
            document.getElementById("sign-email").style.color = "red";
            Swal.fire({
              icon: "error",
              title: "Invalid Email",
              text: "Please enter a valid email",
            });
            return;
          }

          if (
            !result.valid &&
            result.message ===
              "User credentials already exist! Please use unique email and username"
          ) {
            console.log(result.which);
            if (result.which === "email") {
              document.getElementById("sign-email").style.border =
                "1px solid red";
            } else if (result.which === "username") {
              document.getElementById("sign-user-name").style.border =
                "1px solid red";
            } else if (result.which === "both") {
              document.getElementById("sign-email").style.border =
                "1px solid red";
              document.getElementById("sign-user-name").style.border =
                "1px solid red";
            }

            Swal.fire({
              icon: "error",
              title: "User Already Exists",
              text: result.message,
            });
            return;
          }

          if (result.valid) {
            Swal.fire({
              icon: "success",
              title: "Registration Successful",
              text: "You can now login",
              timer: 1000,
            });

            window.location.href = `${BASE_URL}/login`;
          }
        } catch (err) {
          console.log(err.message);
          Swal.fire({
            icon: "error",
            title: "Registration Failed",
            text: "Please try again",
            showConfirmButton: true,
          });
          window.location.href = `${BASE_URL}`;
        }
      });

      document.getElementById("sign-email").addEventListener("input", () => {
        document.getElementById("sign-email").style.border = "none";
        document.getElementById("sign-email").style.color = "black";
      });

      document
        .getElementById("sign-user-name")
        .addEventListener("input", () => {
          document.getElementById("sign-user-name").style.border = "none";
          document.getElementById("sign-user-name").style.color = "black";
        });

      cancelBtn.addEventListener("click", () => {
        window.location.href = `${BASE_URL}`;
      });
    </script>
  </body>
</html>
