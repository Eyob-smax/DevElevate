<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <style>
      .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bar {
        display: inline-block;
        width: 7px;
        height: 20px;
        font-size: 40px;
        background-color: #f97102;
        /* background-color: rgba(255, 255, 255, 0.5); */
        border-radius: 10px;
        animation: scale-up4 1s linear infinite;
      }

      .bar:nth-child(2) {
        height: 35px;
        margin: 0 5px;
        animation-delay: 0.25s;
      }

      .bar:nth-child(3) {
        animation-delay: 0.5s;
      }

      @keyframes scale-up4 {
        20% {
          background-color: #ffff;
          transform: scaleY(1.5);
        }

        40% {
          transform: scaleY(1);
        }
      }

      .animate {
        animation: shake 0.5s ease-in-out infinite;
      }
    </style>
    <section
      class="flex-col relative items-center mt-16 justify-center w-[80%] mx-auto"
      id="log-section"
    >
      <div style="display: none" class="loader">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <h1
        id="login-text"
        class="text-center mt-10 h-10 text-3xl font-bold mb-10"
      >
        Log In
      </h1>
      <form class="mb-3">
        <label for="log-email" class="w-[90%] pt-2 mx-auto block"
          >Username</label
        >
        <div
          class="flex items-center w-[90%] px-2 pb-2 border-b-2 border-b-[grey] mx-auto mb-5"
        >
          <i class="fas fa-user text-gray-500"></i
          ><input
            id="log-user-name"
            type="text"
            name="username"
            placeholder="Your User Name"
            class="block mx-auto pt-2 px-4 focus:outline-none"
            required
          />
        </div>

        <label for="email" class="w-[90%] pt-2 mx-auto block">Password</label>
        <div
          class="flex items-center w-[90%] px-2 pb-2 border-b-2 border-b-[grey] mx-auto"
        >
          <i class="fas fa-lock text-gray-500"></i
          ><input
            id="log-pass"
            type="password"
            name="password"
            placeholder="Your Password"
            class="block mx-auto py-2 px-4 focus:outline-none"
            minlength="8"
            required
          />
        </div>

        <div class="text-right mt-[20px] mr-[15px]" id="forget">
          <a id="#forget-password" class="text-[15px]">Forget Password?</a>
        </div>

        <div class="mx-auto w-[90%] mt-16">
          <button
            id="log-btn"
            type="submit"
            class="w-[100%] rounded-3xl border-2 border-black h-10 text-[16px] font-semibold bg-black text-white"
          >
            LOGIN
          </button>
          <button
            id="log-cancel-btn"
            type="button"
            class="w-[100%] rounded-3xl border-2 border-black h-10 text-[16px] font-semibold mt-5"
          >
            CANCEL
          </button>
        </div>
      </form>
    </section>
    <script>
      const BASE_URL = `https://develevate-production.up.railway.app`;
      const logBtn = document.getElementById("log-btn");
      const cancelBtn = document.getElementById("log-cancel-btn");
      const forgetBtn = document.getElementById("forget");
      const form = document.querySelector("form");
      const loader = document.querySelector(".loader");

      async function checkScreenAndDevice() {
        const screen = window.screen.width;
        const device = window.navigator.userAgent;

        if (screen > 500) {
          await Swal.fire({
            title: "Please use a Mobile device",
            text: "This app is optimized for mobile devices",
            icon: "error",
            confirmButtonText: "Ok",
          });
          document.body.innerHTML =
            "Please open it in mobile phones, and then refresh it";
        }
      }

      setInterval(checkScreenAndDevice, 10000);

      document.addEventListener("DOMContentLoaded", async () => {
        checkScreenAndDevice();
      });

      window.addEventListener("resize", () => {
        checkScreenAndDevice();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        loader.style.display = "block flex";
        try {
          const username = document.getElementById("log-user-name").value;
          const password = document.getElementById("log-pass").value;
          const data = {
            username,
            password,
          };
          const res = await fetch(`${BASE_URL}/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const { success, message } = await res.json();
          if (!success) {
            await Swal.fire({
              icon: "error",
              title: "Error logging in",
              text: message,
            });
            return;
          }
          await Swal.fire({
            icon: "success",
            title: "Logged in successfully",
            text: message,
            timer: 2000,
          });
          window.location.href = `${BASE_URL}/home`;
        } catch (err) {
          await Swal.fire({
            icon: "error",
            title: "Error logging in",
            text: "An error occurred while logging in",
          });
        } finally {
          loader.style.display = "none";
        }
      });

      document
        .getElementById("#forget-password")
        .addEventListener("click", async () => {
          await Swal.fire({
            title: "Forget Password, contact the admin",
            html: "<a href='https://t.me/alnova19' style='color:#f97102'>Click here</a>",
            icon: "info",
            confirmButtonText: "Ok",
          });
        });
      cancelBtn.addEventListener("click", () => {
        window.location.href = `${BASE_URL}`;
      });
    </script>
  </body>
</html>
