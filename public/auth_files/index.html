<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Hero Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <section
      class="bg-[url(./loginBg.jpg)] bg-center bg-cover relative h-screen"
      id="first-page"
    >
      <div
        class="absolute top-[70%] left-[50%] translate-x-[-50%] translate-y-[-50%]"
      >
        <button
          class="block font-bold py-2 w-52 bg-white text-black rounded-3xl mb-5 shadow-xl shadow-slate-900/50 hover:scale-105 duration-100"
          id="first-page-log-btn"
        >
          LOGIN
        </button>
        <button
          class="relative block font-bold py-2 w-52 bg-black text-white rounded-3xl shadow-xl shadow-white/40 mb-5 hover:scale-105 duration-100"
          id="first-page-sign-btn"
        >
          SIGN UP
        </button>
      </div>
    </section>

    <script>
      const BASE_URL = `https://develevate-production.up.railway.app`;
      const logBtn = document.getElementById("first-page-log-btn");
      const signBtn = document.getElementById("first-page-sign-btn");

      async function checkScreenAndDevice() {
        const screen = window.screen.width;
        const device = window.navigator.userAgent;

        if (screen > 500) {
          await Swal.fire({
            title: "Please use a Mobile device",
            text: "This app is optimized for mobile devices",
            icon: "error",
            confirmButtonText: "Ok",
          });
          document.body.innerHTML =
            "Please open it in mobile phones, and then refresh it";
        }
      }

      setInterval(checkScreenAndDevice, 10000);

      document.addEventListener("DOMContentLoaded", async () => {
        checkScreenAndDevice();
      });

      window.addEventListener("resize", () => {
        checkScreenAndDevice();
      });

      logBtn.addEventListener("click", () => {
        window.location.href = `${BASE_URL}/login`;
      });

      signBtn.addEventListener("click", () => {
        window.location.href = `${BASE_URL}/register`;
      });
    </script>
  </body>
</html>
